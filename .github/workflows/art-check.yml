name: Character art check

# Watches the Supabase "characters" bucket for new/updated/removed artwork and
# records each drop in art-changes.md (with the snapshot advanced in the same
# commit — art is live the moment it's uploaded, so this is a log, not a queue).
# Needs no secrets: the bucket is listed with the app's public anon key.

on:
  schedule:
    - cron: '0 20 * * *' # daily, alongside the dictionary check
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: art-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the bucket and acknowledge any changes
        run: npm run art:ack

      - name: Commit the art log when something changed
        run: |
          if git diff --quiet -- art-changes.md scripts/art-snapshot.json; then
            echo "No art changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add art-changes.md scripts/art-snapshot.json
            git commit -m "Character art changes detected in the bucket"
            git push
          fi
