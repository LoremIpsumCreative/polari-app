name: Dictionary change check

# Watches the Polari Google Sheet for changes and records them in
# dictionary-changes.md so you can review and upload a batch on your own schedule.
#
# This workflow NEVER writes to Supabase and needs NO secrets — it only fetches
# the public sheet CSV and diffs it against the committed snapshot. Applying the
# batch stays a manual step you run locally: `npm run words:apply`.

on:
  schedule:
    # Daily at 20:00 UTC (~06:00 AEST). Adjust to taste, or add more times.
    - cron: '0 20 * * *'
  workflow_dispatch: {} # lets you run it on demand from the Actions tab

# Allow the job to commit the change log back to the repo.
permissions:
  contents: write

concurrency:
  group: dictionary-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # 22+ because @supabase/supabase-js and its sub-packages declare
          # engines.node >=22.0.0; on 20 every install logs EBADENGINE. Matches
          # art-check.yml so both workflows resolve the same tree.
          node-version: '22.13.x'
          cache: npm

      - run: npm ci

      # words:check exits 1 when there are pending changes, so this step "fails"
      # on purpose; continue-on-error lets the job carry on and branch on it.
      - name: Check the Google Sheet for changes
        id: check
        run: npm run words:check
        continue-on-error: true

      - name: Commit the change log when there are pending changes
        if: steps.check.outcome == 'failure'
        run: |
          if git diff --quiet -- dictionary-changes.md; then
            echo "Change log identical to last run — nothing new to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dictionary-changes.md
            git commit -m "Dictionary changes detected in the Google Sheet"
            git push
            echo "Committed updated dictionary-changes.md."
          fi
